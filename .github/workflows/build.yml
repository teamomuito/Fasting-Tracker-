name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform 36 and build-tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('app/build.gradle.kts') }}
      # --continue lets assembleDebug run even when a unit test fails, so the APK is still produced.
      - name: Test and build debug APK
        run: ./gradlew --no-daemon --continue testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fasting-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fasting-tracker-screenshots
          path: app/build/outputs/screenshots/
          if-no-files-found: warn
